# Development tooling only. The core is a single stdlib-only file, not a
# package; the distributable package lives in mcp/pyproject.toml.

[tool.ruff]
target-version = "py310"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]

[tool.pytest.ini_options]
testpaths = ["core"]
python_files = "test_*.py"
markers = [
    "network: hits live RFC Editor endpoints; excluded from CI",
]
addopts = "-m 'not network'"

[dependency-groups]
dev = [
    "pytest>=8.0",
    "ruff>=0.9",
]
