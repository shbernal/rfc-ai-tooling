# Development tooling only. The core is a single stdlib-only file, not a
# package; the distributable package lives in mcp/pyproject.toml.

[project]
name = "rfc-ai-tooling-dev"
version = "0.0.0"
description = "Development environment for rfc-ai-tooling (not published)"
requires-python = ">=3.10"

[tool.ruff]
target-version = "py310"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]

[tool.pytest.ini_options]
testpaths = ["core"]
python_files = "test_*.py"
markers = [
    "network: hits live RFC Editor endpoints; excluded from CI",
]
addopts = "-m 'not network'"

[dependency-groups]
dev = [
    "pytest>=8.0",
    "ruff>=0.9",
    # Not needed to run the tests, but without it `import mcp` from the repo
    # root resolves to the mcp/ directory as an empty namespace package
    # instead of failing. Installing the real SDK keeps that name honest.
    "mcp>=2.0.0",
]
