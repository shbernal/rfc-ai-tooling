# Development tooling only. The core is a single stdlib-only file, not a
# package; the distributable package lives in mcp/pyproject.toml.

[project]
name = "rfc-ai-tooling-dev"
version = "0.0.0"
description = "Development environment for rfc-ai-tooling (not published)"
requires-python = ">=3.10"

[tool.ruff]
target-version = "py310"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]

[tool.mypy]
# The floor rail, so the checker reads the language the oldest supported
# interpreter does.
python_version = "3.10"
# core/rfc.py is the implementation; the two vendored copies are byte-identical
# to it, so checking them again only repeats its errors. server.py imports one
# of them, which is why the import is followed silently rather than excluded.
files = ["core/rfc.py", "mcp/src/mcp_server_rfc/server.py", "mcp/smoke.py"]
mypy_path = "mcp/src"

[[tool.mypy.overrides]]
module = "mcp_server_rfc.rfc"
follow_imports = "silent"

[tool.pytest.ini_options]
# core/ tests the implementation; mcp/tests tests the adapter around it. The
# adapter's tests need the mcp SDK, which is why it is a dev dependency below
# and why CI installs it rather than running with --no-project.
testpaths = ["core", "mcp/tests"]
pythonpath = ["mcp/src"]
python_files = "test_*.py"
markers = [
    "network: hits live RFC Editor endpoints; excluded from CI",
]
addopts = "-m 'not network'"

[tool.coverage.report]
# Run as a script, not by anything a test can call in-process.
exclude_also = ['if __name__ == "__main__":']

[dependency-groups]
dev = [
    "pytest>=9.1",
    "ruff>=0.16",
    # Not needed to run the tests, but without it `import mcp` from the repo
    # root resolves to the mcp/ directory as an empty namespace package
    # instead of failing. Installing the real SDK keeps that name honest.
    "mcp>=2.2.0",
    "mypy>=2.3.1",
    "pytest-cov>=7.1.0",
]
