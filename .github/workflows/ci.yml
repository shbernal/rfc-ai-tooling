name: ci

on:
  push:
    branches: [main]
  pull_request:
  # Called by publish.yml so a release runs the same checks as a pull request.
  # A tag push does not match the `branches` filter above and would otherwise
  # publish with nothing verified on that ref.
  workflow_call:

jobs:
  test:
    # The core touches the filesystem (mirror paths, SQLite, subprocess), and
    # each of those is where Windows and macOS differ from Linux.
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
        python: ["3.10", "3.13", "3.14"]
    steps:
      - uses: actions/checkout@v7
      # Pinned to an exact version, not @v10: setup-uv stopped publishing major
      # and minor tags at v8, so @v10 does not resolve. Bumping it is a manual
      # edit in every workflow here.
      - uses: astral-sh/setup-uv@v10.3.2
      - name: Run tests
        # Network-marked tests are excluded by the addopts in pyproject.toml.
        # --with mcp is not optional under --no-project: mcp/tests imports the
        # SDK, and without it installed `import mcp` silently resolves to this
        # repo's mcp/ directory as an empty namespace package.
        run: uv run --python ${{ matrix.python }} --with pytest --with mcp --no-project pytest -q

  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: astral-sh/setup-uv@v10.3.2
      - run: uv run ruff check .
      - run: uv run ruff format --check .

  typecheck:
    # The MCP SDK builds each tool's JSON schema from server.py's annotations,
    # so there they are the contract the model is handed, not documentation.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: astral-sh/setup-uv@v10.3.2
      - run: uv run mypy

  vendor:
    # The shared core is copied into both surfaces rather than imported. If a
    # copy drifts, the skill and the MCP server quietly stop behaving the same
    # way, and nothing else would catch it.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - run: make check-vendor

  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: astral-sh/setup-uv@v10.3.2
      - run: uv build
        working-directory: mcp

  smoke:
    # A real stdio JSON-RPC session against the working tree. The unit tests
    # call the tool functions directly; this is the only job that proves the
    # protocol layer between a client and them still works. It hits the RFC
    # Editor, which is why it is a job of its own and not part of `test`.
    #
    # It runs on every OS because stdio is the transport, and pipes, newlines
    # and process spawning are exactly what Windows does differently.
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    steps:
      - uses: actions/checkout@v7
      - uses: astral-sh/setup-uv@v10.3.2
      # `make smoke-local` spelled out, because Windows runners have neither
      # make nor python3. Only the server goes through a project `uv run`,
      # which syncs the dev group the SDK is declared in; smoke.py is
      # stdlib-only, so it runs --no-project rather than nesting one project
      # run inside another.
      - shell: bash
        run: >-
          PYTHONPATH=mcp/src uv run --no-project python mcp/smoke.py
          --expect-version "$(uv version --short --project mcp)"
          -- uv run python -m mcp_server_rfc.server
