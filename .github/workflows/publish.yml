name: publish

on:
  push:
    tags: ["v*"]
  release:
    types: [published]
  workflow_dispatch:
    inputs:
      repository:
        description: "Package index to publish to"
        type: choice
        options: [testpypi, pypi]
        default: testpypi

jobs:
  # Tag pushes do not match test.yml's `branches: [main]` filter, so without
  # this the release ref would be published with nothing verified on it.
  verify:
    uses: ./.github/workflows/test.yml

  publish-mcp:
    needs: verify
    if: github.event_name == 'push' || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    environment: release
    permissions:
      # Trusted publishing (OIDC). No long-lived token lives in this repo.
      id-token: write
    steps:
      - uses: actions/checkout@v7
      - uses: astral-sh/setup-uv@v10.2.0

      # The tag is the only thing a human types at release time, and nothing
      # else ties it to what actually gets uploaded: tagging v0.2.0 without
      # bumping the manifest would publish 0.1.0 under a v0.2.0 release.
      - name: Tag matches the packaged version
        if: startsWith(github.ref, 'refs/tags/')
        run: |
          tag="${GITHUB_REF_NAME#v}"
          packaged=$(grep -m1 '^version = ' mcp/pyproject.toml | cut -d'"' -f2)
          if [ "$tag" != "$packaged" ]; then
            echo "::error::tag $GITHUB_REF_NAME implies $tag, but mcp/pyproject.toml declares $packaged"
            exit 1
          fi
          echo "tag $GITHUB_REF_NAME matches packaged version $packaged"
          for listed in $(jq -r '.version, .packages[].version' mcp/server.json); do
            if [ "$tag" != "$listed" ]; then
              echo "::error::tag $GITHUB_REF_NAME implies $tag, but mcp/server.json declares $listed"
              exit 1
            fi
          done

      - run: uv build
        working-directory: mcp

      # --check-url makes a re-run idempotent. Without it, re-running a release
      # (or a dispatch at an already-published version) fails with a 400 rather
      # than skipping the files that are already there.
      - name: Publish to TestPyPI
        if: inputs.repository == 'testpypi'
        run: uv publish --publish-url https://test.pypi.org/legacy/ --check-url https://test.pypi.org/simple/
        working-directory: mcp

      - name: Publish to PyPI
        if: inputs.repository != 'testpypi'
        run: uv publish --check-url https://pypi.org/simple/
        working-directory: mcp

  # The registry verifies ownership by reading the mcp-name line out of the
  # package's PyPI description, so this can only run once that version is on
  # PyPI, and only for real tags — a TestPyPI dispatch has nothing to list.
  publish-registry:
    needs: publish-mcp
    if: github.event_name == 'push'
    runs-on: ubuntu-latest
    permissions:
      id-token: write
      contents: read
    env:
      SERVER_NAME: io.github.shbernal/rfc-ai-tooling
      PUBLISHER_VERSION: v1.8.4
    steps:
      - uses: actions/checkout@v7

      # The registry refuses to re-publish a version, so a re-run of the
      # release would fail here without this check.
      - name: Check whether this version is already listed
        id: existing
        run: |
          version="${GITHUB_REF_NAME#v}"
          status=$(curl -s -o /dev/null -w '%{http_code}' \
            "https://registry.modelcontextprotocol.io/v0/servers/${SERVER_NAME/\//%2F}/versions/$version")
          if [ "$status" = 200 ]; then
            echo "listed=true" >> "$GITHUB_OUTPUT"
            echo "::notice::$SERVER_NAME@$version is already listed; skipping"
          else
            echo "listed=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Install mcp-publisher
        if: steps.existing.outputs.listed == 'false'
        run: |
          curl -sL "https://github.com/modelcontextprotocol/registry/releases/download/$PUBLISHER_VERSION/mcp-publisher_linux_amd64.tar.gz" \
            | tar xz mcp-publisher

      # PyPI's JSON API can lag the upload by a minute or two, and until it
      # serves the new version the registry rejects the package as missing.
      - name: Publish to the MCP Registry
        if: steps.existing.outputs.listed == 'false'
        working-directory: mcp
        run: |
          ../mcp-publisher login github-oidc
          for attempt in 1 2 3 4 5; do
            ../mcp-publisher publish && exit 0
            echo "attempt $attempt failed; retrying in 60s"
            sleep 60
          done
          exit 1

  publish-skill:
    needs: verify
    if: github.event_name == 'release'
    runs-on: ubuntu-latest
    environment: release
    permissions:
      contents: read
    env:
      SKILL_SLUG: rfc-lookup
      # `inspect` needs a fully-qualified skill; `publish` resolves the owner
      # from the token, which is why the handle appears here and not below.
      SKILL_REF: "@shbernal/rfc-lookup"
    steps:
      - uses: actions/checkout@v7
        with:
          # Need tag history to diff skill/ against the previous release.
          fetch-depth: 0

      - name: Check whether the skill changed since the last release
        id: diff
        env:
          RELEASE_TAG: ${{ github.event.release.tag_name }}
        run: |
          prev_tag=$(git tag --sort=-creatordate | grep -vFx "$RELEASE_TAG" | head -1)
          if [ -z "$prev_tag" ] || ! git diff --quiet "$prev_tag" HEAD -- skill/; then
            echo "changed=true" >> "$GITHUB_OUTPUT"
          else
            echo "changed=false" >> "$GITHUB_OUTPUT"
          fi

      - uses: actions/setup-node@v7
        if: steps.diff.outputs.changed == 'true'
        with:
          node-version: "22"

      # Pinned; clawhub has no OIDC trusted-publishing path, so auth is a
      # long-lived token (CLAWHUB_TOKEN) rather than id-token: write.
      - name: Install clawhub
        if: steps.diff.outputs.changed == 'true'
        run: npm install -g clawhub@0.23.3

      - name: Authenticate to ClawHub
        if: steps.diff.outputs.changed == 'true'
        run: clawhub auth login --token "${{ secrets.CLAWHUB_TOKEN }}" --no-browser

      # ClawHub refuses to re-publish an existing version and exits non-zero, so
      # without this the whole workflow fails whenever the version is already up
      # — a re-run of a release, or a skill published by hand before the tag.
      # This is the ClawHub-side equivalent of the `--check-url` that makes the
      # PyPI half idempotent. `inspect` exits 0 when the version exists and 1
      # when it does not.
      - name: Check whether this version is already published
        id: existing
        if: steps.diff.outputs.changed == 'true'
        env:
          RELEASE_TAG: ${{ github.event.release.tag_name }}
        run: |
          version="${RELEASE_TAG#v}"
          if clawhub inspect "$SKILL_REF" --version "$version" >/dev/null 2>&1; then
            echo "published=true" >> "$GITHUB_OUTPUT"
            echo "::notice::$SKILL_REF@$version is already published; skipping"
          else
            echo "published=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Publish skill to ClawHub
        if: steps.diff.outputs.changed == 'true' && steps.existing.outputs.published == 'false'
        env:
          RELEASE_TAG: ${{ github.event.release.tag_name }}
        run: |
          clawhub skill publish skill \
            --slug "$SKILL_SLUG" \
            --version "${RELEASE_TAG#v}" \
            --name "RFC lookup" \
            --source-repo "${{ github.repository }}" \
            --source-commit "${{ github.sha }}" \
            --source-path skill \
            --changelog "${{ github.event.release.html_url }}"
